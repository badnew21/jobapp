<html><body><form id="f" onsubmit="event.preventDefault(); location.href='thanks.html'">
<div id="s1">
  <label for="fn">First Name *</label><input id="fn" required>
  <label for="ln">Last Name *</label><input id="ln" required>
  <label>Email <input type="email" name="email" required></label>
  <label for="ph">Phone</label><input id="ph" type="tel" required>
  <label for="co">Current company name</label><input id="co">
  <label for="cv">Resume/CV</label><input id="cv" type="file" required>
  <button type="button" onclick="document.getElementById('s1').style.display='none';document.getElementById('s2').style.display='block'">Next</button>
</div>
<div id="s2" style="display:none">
  <fieldset><legend>Are you legally authorized to work in the United States?</legend>
    <label><input type="radio" name="auth" value="1" required> Yes</label>
    <label><input type="radio" name="auth" value="0"> No</label></fieldset>
  <label for="wk">Are you able to work weekends?</label>
  <select id="wk" required><option value="">Select...</option><option value="y">Yes</option><option value="n">No</option></select>
  <label for="g">Gender</label>
  <select id="g"><option value="">Select...</option><option value="f">Female</option><option value="d">Decline to self-identify</option></select>
  <label for="pay">Desired pay</label><input id="pay" required>
  <label><input type="checkbox" id="agree" required> I agree to the privacy policy</label>
  <button type="submit">Submit application</button>
</div>
</form></body></html>
